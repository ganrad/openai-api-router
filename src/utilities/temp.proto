syntax = "proto3";

package eligibility.v1;

service EligibilityService {
  rpc CheckEligibility (EligibilityRequest) returns (EligibilityResponse);
  rpc GetBenefits     (BenefitsRequest)     returns (BenefitsResponse);
}

message EligibilityRequest {
  // Identify the subscriber/member
  string subscriber_id = 1; // e.g., SUB12345
  string member_id     = 2; // e.g., M1000001 (often on card)
  string date_of_birth = 3; // YYYY-MM-DD

  // What are we checking?
  string date_of_service = 4; // YYYY-MM-DD
  string provider_npi    = 5; // optional but common in real flows
}

enum EligibilityStatus {
  ELIGIBILITY_STATUS_UNSPECIFIED = 0;
  ELIGIBLE   = 1;
  INELIGIBLE = 2;
}

enum NetworkStatus {
  NETWORK_STATUS_UNSPECIFIED = 0;
  IN_NETWORK  = 1;
  OUT_OF_NETWORK = 2;
}

message EligibilityResponse {
  EligibilityStatus status = 1;
  string reason           = 2;

  // Basic plan details (minimal)
  string plan_id          = 3;
  string plan_name        = 4;
  string group_number     = 5;
  string coverage_start   = 6; // YYYY-MM-DD
  string coverage_end     = 7; // YYYY-MM-DD or empty if active/open-ended
  NetworkStatus network   = 8;
}

message BenefitsRequest {
  string subscriber_id = 1;
  string member_id     = 2;
  string date_of_service = 3; // YYYY-MM-DD
}

message Money {
  string currency = 1; // e.g., "USD"
  int64 cents     = 2; // store as cents to avoid floating issues
}

message Deductible {
  Money individual_total = 1;
  Money individual_met   = 2;
  Money family_total     = 3;
  Money family_met       = 4;
}

message OutOfPocketMax {
  Money individual_total = 1;
  Money individual_met   = 2;
  Money family_total     = 3;
  Money family_met       = 4;
}

message ServiceBenefit {
  string service_type = 1; // e.g., "Primary Care Visit"
  Money copay         = 2; // if copay-based
  double coinsurance  = 3; // e.g., 0.2 for 20%
  NetworkStatus network = 4;
  bool covered        = 5;
}

message BenefitsResponse {
  string plan_id      = 1;
  string plan_name    = 2;
  Deductible deductible = 3;
  OutOfPocketMax oop_max = 4;

  // A few common benefits
  repeated ServiceBenefit services = 5;
}