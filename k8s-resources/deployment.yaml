kind: Deployment
apiVersion: apps/v1
metadata:
  name: az-api-gateway-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: az-api-gateway
  template:
    metadata:
      labels:
        app: az-api-gateway
    spec:
      volumes:
        - name: api-gateway-cm-vol
          configMap:
            name: api-gateway-config-cm
      containers:
        - name: az-api-gateway
          image: "oaiapigateway.azurecr.io/az-oai-api-gateway:v1.020424"
          volumeMounts:
            - name: api-gateway-cm-vol
              mountPath: /home/node/app
          env:
            - name: API_GATEWAY_NAME
              value: "AOAI-API-Gateway-01"
            - name: API_GATEWAY_CONFIG_FILE
              value: "/home/node/app/api-router-config.json"
            - name: API_GATEWAY_KEY
              value: "apigtwy-2024!"
            - name: API_GATEWAY_ENV
              value: "dev"
            - name: API_GATEWAY_PORT
              value: "8000"
            - name: API_GATEWAY_LOG_LEVEL
              value: "info"
            - name: API_GATEWAY_METRICS_CINTERVAL
              value: "5"
            - name: API_GATEWAY_METRICS_CHISTORY
              value: "5"
            - name: IMAGE_ID
              value: "oaiapigateway.azurecr.io/az-oai-api-gateway:v1.020424"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_SVC_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: API_GATEWAY_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/dev/apirouter/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 25
          readinessProbe:
            httpGet:
              path: /api/v1/dev/apirouter/healthz
              port: http
